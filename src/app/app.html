<!--app.html-->

<main class="app">
  <section>
    <!-- Edit information -->
    <div class="edit-info">
      <p><mat-icon matSuffix>edit</mat-icon> To edit the value, just click on the cell.</p>
    </div>

    <!-- Title of application -->
    <h1>Periodic elements table</h1>

    <!-- Show JSON list (for check)
    <p>{{store.elements() | json }}</p>-->

    @if(!store.loading()){
      <!-- table with periodic elements -->
      <elements-table></elements-table>
    }
    @else {
      <!--spinner-->
      <mat-spinner style="margin:0 auto;" mode="indeterminate"/>
    }
  </section>
  
</main>
